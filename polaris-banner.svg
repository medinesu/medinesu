<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Derin Gece Gradyanı -->
    <radialGradient id="deepCosmos" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0e1726" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#080c14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <!-- Kutup Yıldızı Nebula Işıltısı -->
    <radialGradient id="nebulaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#67E8F9" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Tipografi Parıltısı -->
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD">
        <animate attributeName="stop-color" values="#BAE6FD;#FFFFFF;#38BDF8;#BAE6FD" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#38BDF8;#BAE6FD;#FFFFFF" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#BAE6FD;#FFFFFF;#38BDF8" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Parıltı Filtresi -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frameClip">
      <rect width="1200" height="460" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- Arka Plan Tabanı -->
    <rect width="1200" height="460" fill="url(#deepCosmos)"/>
    <rect width="1200" height="460" fill="none" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1.5" rx="16"/>

    <!-- Yıldız Tozu & Mikro Parçacıklar -->
    <g opacity="0.6">
      <circle cx="120" cy="80" r="1" fill="#fff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="280" cy="220" r="1.5" fill="#7DD3FC"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="90" r="1.2" fill="#fff"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="110" r="1.8" fill="#BAE6FD"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="70" r="1" fill="#fff"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="260" r="1.4" fill="#38BDF8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="380" r="1.2" fill="#fff"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="890" cy="390" r="1.5" fill="#7DD3FC"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Yavaş Süzülen Kozmik Parçacıklar -->
    <circle cx="340" cy="460" r="1.6" fill="#BAE6FD" opacity="0.4"><animate attributeName="cy" values="460;-20" dur="24s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="460" r="2" fill="#fff" opacity="0.3"><animate attributeName="cy" values="460;-20" dur="32s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="460" r="1.2" fill="#38BDF8" opacity="0.5"><animate attributeName="cy" values="460;-20" dur="20s" repeatCount="indefinite"/></circle>

    <!-- POLARIS ODAĞI: Kozmik Yörüngeler ve Çekirdek -->
    <g transform="translate(600, 130)">
      <!-- Arka Plan Nebula Halesi -->
      <circle cx="0" cy="0" r="90" fill="url(#nebulaCore)">
        <animate attributeName="r" values="80;95;80" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- İnce Astrolab / Yörünge Çemberleri -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-dasharray="4 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="68" fill="none" stroke="#BAE6FD" stroke-opacity="0.15" stroke-dasharray="2 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="110s" repeatCount="indefinite"/>
      </circle>

      <!-- 8 Köşeli Kutup Yıldızı Geometrisi -->
      <!-- Ana Dikey/Yatay Işık Kolları -->
      <g filter="url(#softGlow)">
        <path d="M 0 -44 Q 0 0 -44 0 Q 0 0 0 44 Q 0 0 44 0 Q 0 0 0 -44 Z" fill="#FFFFFF">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
        </path>
        <!-- Çapraz Yardımcı Kristal Kollar -->
        <path d="M 0 -26 Q 0 0 -26 0 Q 0 0 0 26 Q 0 0 26 0 Q 0 0 0 -26 Z" fill="#7DD3FC" opacity="0.85" transform="rotate(45)">
          <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="90s" repeatCount="indefinite"/>
        </path>
      </g>
      
      <!-- Merkez Çekirdek Kristali -->
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Tipografi Hiyerarşisi -->
    <!-- Üst İnce Kimlik -->
    <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#7DD3FC" letter-spacing="6">
      AUTONOMOUS INTELLIGENCE CORE
    </text>

    <!-- Ana Başlık (POLARIS) -->
    <text x="600" y="305" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="8">
      POLARIS
    </text>

    <!-- Slogan (Canlı Renk Geçişli) -->
    <text x="600" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="500" fill="url(#auroraGlow)" letter-spacing="1.5">
      The Unfailing Compass in an Orbit of Chaos
    </text>

    <!-- Minimal Alt Mühendislik Satırı -->
    <text x="600" y="395" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" fill="#64748B" letter-spacing="3.5">
      SYSTEMS ARCHITECTURE  •  DETERMINISTIC RAG  •  HIGH INTEGRITY
    </text>
  </g>
</svg>
