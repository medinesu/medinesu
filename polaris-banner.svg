<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Slogan Parıltısı -->
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD">
        <animate attributeName="stop-color" values="#BAE6FD;#FFFFFF;#38BDF8;#BAE6FD" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#38BDF8;#BAE6FD;#FFFFFF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#BAE6FD;#FFFFFF;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="canvasClip">
      <rect width="1200" height="460" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    <!-- 1. Yüklediğin Gerçek Fotoğrafı Arka Plan Yapıyoruz -->
    <image href="https://raw.githubusercontent.com/medinesu/medinesu/main/polaris_kutup_isiklari.jpg" x="0" y="0" width="1200" height="460" preserveAspectRatio="xMidYMid slice" />
    
    <!-- Yazılar net okunsun diye üzerine çok hafif sinematik bir gölge/karartma atıyoruz -->
    <rect width="1200" height="460" fill="#02040a" opacity="0.3" />

    <!-- 2. Gökyüzündeki Parıldayıp Sönen Animasyonlu Yıldızlar (Fotoğrafın üzerine eklenecek) -->
    <g fill="#FFFFFF">
      <circle cx="150" cy="80" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite" /></circle>
      <circle cx="320" cy="55" r="2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite" /></circle>
      <circle cx="480" cy="120" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" repeatCount="indefinite" /></circle>
      <circle cx="760" cy="70" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" /></circle>
      <circle cx="920" cy="95" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" /></circle>
      <circle cx="1080" cy="110" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite" /></circle>
    </g>

    <!-- 3. MERKEZ ODAK: Dönen Polaris (Kutup Yıldızı) -->
    <g transform="translate(600, 140)">
      <!-- Yıldızın Arkasındaki Nabız Atan Buz Mavisi Işık -->
      <circle cx="0" cy="0" r="50" fill="#38BDF8" opacity="0.3">
        <animate attributeName="r" values="40;60;40" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" />
      </circle>

      <!-- İnce Astronomik Pusula Çemberi -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#67E8F9" stroke-opacity="0.4" stroke-dasharray="2 6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="100s" repeatCount="indefinite" />
      </circle>

      <!-- 8 Köşeli Dönen Kristal -->
      <g filter="url(#starGlow)">
        <path d="M 0 -45 Q 0 0 -45 0 Q 0 0 0 45 Q 0 0 45 0 Q 0 0 0 -45 Z" fill="#FFFFFF">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite" />
        </path>
        <path d="M 0 -26 Q 0 0 -26 0 Q 0 0 0 26 Q 0 0 26 0 Q 0 0 0 -26 Z" fill="#38BDF8" opacity="0.9" transform="rotate(45)">
          <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="60s" repeatCount="indefinite" />
        </path>
      </g>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>

    <!-- 4. TİPOGRAFİ VE NEFES ALAN SLOGAN -->
    <text x="600" y="260" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="8">
      POLARIS
    </text>

    <!-- Ortaya Çıkıp Usulca Parıldayan Slogan -->
    <g>
      <text x="600" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18.5" font-weight="500" fill="url(#auroraGlow)" letter-spacing="1.5">
        The Unfailing Compass in an Orbit of Chaos
        <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite" />
      </text>
    </g>

    <text x="600" y="340" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" fill="#E2E8F0" letter-spacing="3">
      AI APPLICATION ARCHITECT  •  LOCAL RAG PIPELINES  •  BACKEND SYSTEMS
    </text>

    <!-- İnce Çerçeve -->
    <rect width="1200" height="460" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1.5" rx="16" />
  </g>
</svg>
