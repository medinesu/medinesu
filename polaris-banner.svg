<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Derin Uzay & Organik Nebula Tülleri -->
    <radialGradient id="nebula1" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#0f172a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#010205" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#020617" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#010205" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deepVoid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010205"/>
      <stop offset="50%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#010205"/>
    </linearGradient>

    <!-- Aşırı Parlama / Derin Glow Filtresi -->
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arka Plan Derinlik & Nebula -->
  <rect width="1200" height="460" fill="url(#deepVoid)"/>
  <circle cx="380" cy="180" r="380" fill="url(#nebula1)"/>
  <circle cx="850" cy="150" r="340" fill="url(#nebula2)"/>

  <!-- Bol Yıldızlı, Boy Boy Parıldayan Katman (Pinterest Tarzı Derin Yıldız Alanı) -->
  <g fill="#FFFFFF">
    <!-- Mikro toz / uzak yıldızlar -->
    <circle cx="90" cy="50" r="0.7" opacity="0.3"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="90" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="40" r="0.8" opacity="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="70" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="45" r="0.7" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="90" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="55" r="0.9" opacity="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="80" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.7s" repeatCount="indefinite"/></circle>

    <!-- Orta Katman Belirgin Yıldızlar -->
    <circle cx="140" cy="170" r="1.5" fill="#bae6fd"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="140" r="1.0"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="165" r="1.6" fill="#e0f2fe"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="155" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="175" r="1.5" fill="#bae6fd"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="130" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>

    <!-- Alt Derinlik Yıldızları -->
    <circle cx="190" cy="330" r="0.9" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="370" r="1.3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="340" r="1.0" opacity="0.5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="360" r="1.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5.0s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="320" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="350" r="1.5" fill="#bae6fd"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Parlak Çapraz Lens-Flare Yıldızlar -->
  <g filter="url(#superGlow)">
    <path d="M 220,105 Q 220,113 228,113 Q 220,113 220,121 Q 220,113 212,113 Q 220,113 220,105 Z" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.1;0.95;0.1" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 980,90 Q 980,100 990,100 Q 980,100 980,110 Q 980,100 970,100 Q 980,100 980,90 Z" fill="#67e8f9">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 160,270 Q 160,277 167,277 Q 160,277 160,284 Q 160,277 153,277 Q 160,277 160,270 Z" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 1060,240 Q 1060,248 1068,248 Q 1060,248 1060,256 Q 1060,248 1052,248 Q 1060,248 1060,240 Z" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="4.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Merkez Polaris Kristali & Yoğun Işık Halesi -->
  <g transform="translate(600, 135)" filter="url(#superGlow)">
    <circle cx="0" cy="0" r="58" fill="#38bdf8" opacity="0.22">
      <animate attributeName="r" values="45;68;45" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M 0 -54 Q 0 0 -54 0 Q 0 0 0 54 Q 0 0 54 0 Q 0 0 0 -54 Z" fill="#FFFFFF">
      <animateTransform attributeName="transform" type="rotate" from="0" dur="45s" to="360" repeatCount="indefinite"/>
    </path>
    <path d="M 0 -32 Q 0 0 -32 0 Q 0 0 0 32 Q 0 0 32 0 Q 0 0 0 -32 Z" fill="#7dd3fc" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="45" dur="45s" to="405" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Ana Başlık -->
  <text x="600" y="255" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="9" filter="url(#superGlow)">
    POLARIS
  </text>

  <!-- Yumuşakça Ortaya Çıkıp Kaybolan (Fade In / Fade Out) Slogan -->
  <g>
    <text x="600" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18.5" font-weight="500" fill="#bae6fd" letter-spacing="1.5">
      Polaris: The Unfailing Compass in an Orbit of Chaos
      <animate attributeName="opacity" values="0.05;1;1;0.05;0.05" keyTimes="0;0.3;0.7;0.92;1" dur="6.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Alt Mühendislik Satırı -->
  <text x="600" y="345" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" fill="#64748B" letter-spacing="3.5">
    AI APPLICATION ARCHITECT  •  LOCAL RAG PIPELINES  •  BACKEND SYSTEMS
  </text>

  <!-- İnce Fütüristik Çerçeve -->
  <rect width="1200" height="460" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.5" rx="16"/>
</svg>
