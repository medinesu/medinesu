<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Derin Uzay Boşluğu -->
    <linearGradient id="deepCosmos" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010106" />
      <stop offset="40%" stop-color="#050b1a" />
      <stop offset="100%" stop-color="#0a1128" />
    </linearGradient>

    <!-- Aurora Işıkları (Su Yeşili, Mavi ve Lila/Mor Geçişleri) -->
    <filter id="auroraBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45" />
    </filter>
    <linearGradient id="auroraTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00bbf9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="auroraLilac" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9b5de5" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#c77dff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Gerçekçi Dolunay Gradyanları ve Işık Halesi -->
    <radialGradient id="moonGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="moonSurface" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>

    <!-- Kayan Yıldız (Shooting Star) İzi -->
    <linearGradient id="shootingStarTail" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Pırlanta Gümüş Kolye Yıldızı İçin -->
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="silverAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="hyperBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="10" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Slogan Gradyanı -->
    <linearGradient id="sloganGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"><animate attributeName="stop-color" values="#7dd3fc;#c77dff;#7dd3fc" dur="6s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#ffffff"><animate attributeName="stop-color" values="#ffffff;#e2e8f0;#ffffff" dur="6s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#c77dff"><animate attributeName="stop-color" values="#c77dff;#7dd3fc;#c77dff" dur="6s" repeatCount="indefinite" /></stop>
    </linearGradient>
  </defs>

  <!-- 1. Derin Gökyüzü Arka Planı -->
  <rect width="1200" height="460" fill="url(#deepCosmos)" rx="16" />

  <!-- 2. Yumuşak, Pürüzsüz Aurora Geçişleri (Su Yeşili ve Lila) -->
  <g filter="url(#auroraBlur)">
    <!-- Lila / Eflatun Dalga -->
    <path d="M-100,280 Q300,80 700,200 T1350,150 L1350,460 L-100,460 Z" fill="url(#auroraLilac)" />
    <!-- Su Yeşili / Mavi Dalga -->
    <path d="M-50,340 Q400,160 800,280 T1300,200 L1300,460 L-50,460 Z" fill="url(#auroraTeal)" />
    <path d="M 200,250 Q 600,100 1000,220 T 1300,280 L 1300,460 L 200,460 Z" fill="#00bbf9" opacity="0.15" />
  </g>

  <!-- 3. Dinamik Yıldız Alanı (İrili Ufaklı, Yoğun) -->
  <g fill="#FFFFFF">
    <!-- Uzak, çok küçük yıldızlar -->
    <circle cx="80" cy="50" r="0.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" repeatCount="indefinite" /></circle>
    <circle cx="150" cy="110" r="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite" /></circle>
    <circle cx="280" cy="40" r="0.7"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.2s" repeatCount="indefinite" /></circle>
    <circle cx="360" cy="95" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" /></circle>
    <circle cx="490" cy="65" r="0.6"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" repeatCount="indefinite" /></circle>
    <circle cx="620" cy="120" r="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite" /></circle>
    <circle cx="750" cy="50" r="0.7"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.5s" repeatCount="indefinite" /></circle>
    <circle cx="880" cy="90" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite" /></circle>
    <circle cx="1020" cy="60" r="0.7"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" repeatCount="indefinite" /></circle>
    <circle cx="1140" cy="100" r="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite" /></circle>

    <!-- Büyük, belirgin ve renkli parlak yıldızlar -->
    <circle cx="220" cy="80" r="1.8" fill="#e0f2fe"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="420" cy="130" r="1.5" fill="#f3e8ff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.6s" repeatCount="indefinite" /></circle>
    <circle cx="680" cy="70" r="2.0" fill="#bae6fd"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" /></circle>
    <circle cx="850" cy="140" r="1.6" fill="#e0f2fe"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" repeatCount="indefinite" /></circle>
    <circle cx="1080" cy="85" r="1.9" fill="#f3e8ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite" /></circle>

    <!-- Alt kısımdaki derinlik yıldızları -->
    <circle cx="180" cy="240" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite" /></circle>
    <circle cx="510" cy="270" r="1.0" opacity="0.4" />
    <circle cx="890" cy="220" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite" /></circle>
    <circle cx="1110" cy="260" r="1.1" opacity="0.5" />
  </g>

  <!-- 4. Kayan Yıldızlar (Shooting Stars) -->
  <g transform="rotate(-25)">
    <!-- Hızlı geçen ince yıldız -->
    <line x1="1200" y1="200" x2="1140" y2="200" stroke="url(#shootingStarTail)" stroke-width="1.5" stroke-linecap="round" opacity="0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="4s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="2s" repeatCount="indefinite" />
    </line>
    <!-- Uzun ve parlak geçen yıldız -->
    <line x1="1600" y1="400" x2="1480" y2="400" stroke="url(#shootingStarTail)" stroke-width="2.5" stroke-linecap="round" opacity="0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-2200 0" dur="5.5s" begin="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="5.5s" begin="5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- 5. Göz Alıcı Gerçekçi Dolunay -->
  <g transform="translate(160, 130)">
    <!-- Atmosferik Işık Halesi -->
    <circle cx="0" cy="0" r="65" fill="url(#moonGlowGrad)">
      <animate attributeName="r" values="60;75;60" dur="5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Dolunay Yüzeyi -->
    <circle cx="0" cy="0" r="42" fill="url(#moonSurface)" filter="url(#hyperBloom)" opacity="0.95" />
    
    <!-- Detaylı Ay Kraterleri (Doku) -->
    <g opacity="0.6">
      <ellipse cx="-12" cy="-14" rx="12" ry="8" fill="#94a3b8" transform="rotate(-20 -12 -14)" opacity="0.8" />
      <ellipse cx="14" cy="-8" rx="10" ry="14" fill="#64748b" transform="rotate(15 14 -8)" opacity="0.6" />
      <circle cx="-16" cy="12" r="8" fill="#94a3b8" opacity="0.7" />
      <circle cx="12" cy="16" r="6" fill="#475569" opacity="0.5" />
      <circle cx="2" cy="6" r="5" fill="#64748b" opacity="0.4" />
      <circle cx="-22" cy="-4" r="3" fill="#334155" opacity="0.5" />
      <circle cx="20" cy="-18" r="4" fill="#475569" opacity="0.6" />
      <!-- Ufak yüzey lekeleri -->
      <path d="M-6,22 Q2,18 8,24" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5" />
      <path d="M18,4 Q24,-2 16,-12" stroke="#e2e8f0" stroke-width="2" fill="none" opacity="0.3" />
    </g>
  </g>

  <!-- 6. Minimize Edilmiş Dağlık/Orman Yüzeyi (Gökyüzüne çok yer açıldı) -->
  <g fill="#010205">
    <path d="M0,460 L0,435 Q300,425 600,435 T1200,428 L1200,460 Z" />
    <!-- Sadece dipte çok ufak çam silüetleri -->
    <polygon points="40,436 45,415 50,436" />
    <polygon points="46,437 52,408 58,437" />
    <polygon points="54,438 60,420 66,438" />
    
    <polygon points="1120,432 1125,410 1130,432" />
    <polygon points="1126,433 1133,402 1140,433" />
  </g>

  <!-- 7. MERKEZ: Kolyendeki Gümüş/Pırlanta Asimetrik Polaris -->
  <g transform="translate(600, 140)">
    <!-- Arkadaki ince beyaz parıltı -->
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" opacity="0.15" filter="url(#hyperBloom)">
       <animate attributeName="opacity" values="0.08;0.25;0.08" dur="4s" repeatCount="indefinite"/>
    </circle>

    <g filter="url(#hyperBloom)">
      <!-- Üst Kısa -->
      <path d="M 0,-44 L 3.5,-12 L 0,0 L -3.5,-12 Z" fill="url(#silverMetal)"/>
      <!-- Sağ Kısa -->
      <path d="M 44,0 L 12,3.5 L 0,0 L 12,-3.5 Z" fill="url(#silverAccent)"/>
      <!-- Sol Kısa -->
      <path d="M -44,0 L -12,3.5 L 0,0 L -12,-3.5 Z" fill="url(#silverMetal)"/>
      
      <!-- ASİMETRİK İMZA: Hançer Alt Uzun Işın -->
      <path d="M 0,0 L 3.5,12 L 1.2,88 L -1.2,88 L -3.5,12 Z" fill="url(#silverMetal)">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
      </path>

      <!-- Ara İnce Parıltılar -->
      <path d="M 28,-28 L 8,-8 L 0,0 L -8,-8 Z" fill="url(#silverAccent)" opacity="0.85"/>
      <path d="M 28,28 L 8,8 L 0,0 L 8,-8 Z" fill="url(#silverMetal)" opacity="0.75"/>
      <path d="M -28,28 L -8,8 L 0,0 L -8,-8 Z" fill="url(#silverAccent)" opacity="0.85"/>
      <path d="M -28,-28 L -8,-8 L 0,0 L -8,-8 Z" fill="url(#silverMetal)" opacity="0.75"/>
    </g>
    
    <!-- Merkez Elmas Nokta -->
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" filter="url(#hyperBloom)">
      <animate attributeName="r" values="3.5;6;3.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    
    <animateTransform attributeName="transform" type="rotate" from="-6" to="6" dur="8s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- 8. TİPOGRAFİ (Sloganlar) -->
  <text x="600" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="31" font-weight="800" fill="#ffffff" letter-spacing="10" filter="url(#hyperBloom)">
    POLARIS
  </text>

  <g>
    <text x="600" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18.5" font-weight="500" fill="url(#sloganGlow)" letter-spacing="1.5">
      The Unfailing Compass in an Orbit of Chaos
      <animate attributeName="opacity" values="0.15;1;1;0.15;0.15" keyTimes="0;0.25;0.75;0.9;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="600" y="358" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" fill="#cbd5e1" letter-spacing="3.5">
    AI APPLICATION ARCHITECT  •  LOCAL RAG PIPELINES  •  BACKEND SYSTEMS
  </text>

  <rect width="1200" height="460" fill="none" stroke="#c77dff" stroke-opacity="0.25" stroke-width="1.5" rx="16"/>
</svg>
