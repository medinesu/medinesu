<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Uzay Boşluğu ve Nebula Işıltıları -->
    <radialGradient id="spaceGlow1" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#7F00FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="polarisCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#A5F3FC"/>
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Sloganın Üzerinden Akan Canlı Kutup Işıltısı (Aurora Shimmer) -->
    <linearGradient id="auroraTextShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#FFFFFF;#00E5FF;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#00E5FF;#38BDF8;#FFFFFF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#38BDF8;#FFFFFF;#00E5FF" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Kutup Yıldızı Parlama Filtresi -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="boundary">
      <rect x="10" y="10" width="1180" height="400" rx="20"/>
    </clipPath>
  </defs>

  <!-- Arka Plan Kartı -->
  <rect x="10" y="10" width="1180" height="400" rx="20" fill="#06080d" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="10" y="10" width="1180" height="400" rx="20" fill="url(#spaceGlow1)"/>

  <!-- Yüzen Uzay Parçacıkları & Yıldızlar -->
  <g clip-path="url(#boundary)">
    <circle cx="150" cy="180" r="1.5" fill="#fff" opacity="0.4"><animate attributeName="cy" values="420;0" dur="22s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="90" r="2.2" fill="#A5F3FC" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="140" r="1.8" fill="#fff" opacity="0.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="280" r="2" fill="#67E8F9" opacity="0.4"><animate attributeName="cy" values="420;0" dur="28s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="310" r="1.2" fill="#fff" opacity="0.3"><animate attributeName="cy" values="420;0" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="70" r="2.5" fill="#fff" opacity="0.7"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="80" r="1.5" fill="#fff" opacity="0.4"><animate attributeName="cy" values="420;0" dur="30s" repeatCount="indefinite"/></circle>
  </g>

  <!-- POLARIS (Kutup Yıldızı) İkonografisi -->
  <g transform="translate(600, 115)" filter="url(#starGlow)">
    <!-- Hareketli Işık Halesi -->
    <circle cx="0" cy="0" r="42" fill="url(#polarisCore)">
      <animate attributeName="r" values="36;46;36" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Kutup Yıldızı Geometrisi -->
    <path d="M 0 -38 Q 0 0 -38 0 Q 0 0 0 38 Q 0 0 38 0 Q 0 0 0 -38 Z" fill="#FFFFFF">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 -22 Q 0 0 -22 0 Q 0 0 0 22 Q 0 0 22 0 Q 0 0 0 -22 Z" fill="#67E8F9" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Tipografi & Slogan -->
  <text x="600" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC" letter-spacing="3">
    POLARIS
  </text>
  
  <!-- Canlı Parlayan Slogan -->
  <text x="600" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="url(#auroraTextShimmer)" letter-spacing="1.5">
    Polaris: The Unfailing Compass in an Orbit of Chaos
  </text>

  <!-- Mimari Alt Başlık -->
  <text x="600" y="325" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#94A3B8" letter-spacing="2">
    AI ARCHITECTURES  •  LOCAL RAG PIPELINES  •  BACKEND SYSTEMS
  </text>
</svg>
