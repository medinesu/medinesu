SVG DOSYASI

<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="silverAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="diamondBloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feGaussianBlur stdDeviation="25" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="silverTextGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8">
        <animate attributeName="stop-color" values="#94A3B8;#FFFFFF;#38BDF8;#94A3B8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#38BDF8;#94A3B8;#FFFFFF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#CBD5E1">
        <animate attributeName="stop-color" values="#CBD5E1;#94A3B8;#FFFFFF;#CBD5E1" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <clipPath id="canvasClip">
      <rect width="1200" height="460" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#canvasClip)">
    
    <!-- İŞTE BURASI: UZUN KODU SADECE YAZIYI SİLEREK TIRNAKLARIN İÇİNE YAPIŞTIR -->
    <image href="data:image/jpeg;base64," x="0" y="0" width="1200" height="460" preserveAspectRatio="xMidYMid slice" />
    
    <rect width="1200" height="460" fill="#010308" opacity="0.4" />

    <g fill="#FFFFFF" opacity="0.9">
      <circle cx="180" cy="75" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" repeatCount="indefinite" /></circle>
      <circle cx="350" cy="110" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite" /></circle>
      <circle cx="510" cy="65" r="1.1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.8s" repeatCount="indefinite" /></circle>
      <circle cx="790" cy="85" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" /></circle>
      <circle cx="960" cy="100" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite" /></circle>
      <circle cx="1090" cy="130" r="1.2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.7s" repeatCount="indefinite" /></circle>
    </g>

    <g transform="translate(600, 140)">
      <circle cx="0" cy="0" r="65" fill="#FFFFFF" opacity="0.15" filter="url(#diamondBloom)">
        <animate attributeName="r" values="55;75;55" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
      </circle>

      <g filter="url(#diamondBloom)">
        <path d="M 0,-42 L 3,-10 L 0,0 L -3,-10 Z" fill="url(#silverMetal)"/>
        <path d="M 42,0 L 12,3 L 0,0 L 12,-3 Z" fill="url(#silverAccent)"/>
        <path d="M -42,0 L -12,3 L 0,0 L -12,-3 Z" fill="url(#silverMetal)"/>
        <path d="M 0,0 L 3,10 L 1.2,85 L -1.2,85 L -3,10 Z" fill="url(#silverMetal)">
          <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
        </path>
        <path d="M 28,-28 L 8,-8 L 0,0 L -8,-8 Z" fill="url(#silverAccent)" opacity="0.75"/>
        <path d="M 28,28 L 8,8 L 0,0 L 8,-8 Z" fill="url(#silverMetal)" opacity="0.75"/>
        <path d="M -28,28 L -8,8 L 0,0 L -8,-8 Z" fill="url(#silverAccent)" opacity="0.75"/>
        <path d="M -28,-28 L -8,-8 L 0,0 L -8,-8 Z" fill="url(#silverMetal)" opacity="0.75"/>
      </g>

      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" filter="url(#diamondBloom)">
        <animate attributeName="r" values="3.5;6;3.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
      <animateTransform attributeName="transform" type="rotate" from="-8" to="8" dur="8s" repeatCount="indefinite" additive="sum"/>
    </g>

    <text x="600" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="10" filter="url(#diamondBloom)">
      POLARIS
    </text>

    <g>
      <text x="600" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18.5" font-weight="500" fill="url(#silverTextGlow)" letter-spacing="1.5">
        The Unfailing Compass in an Orbit of Chaos
        <animate attributeName="opacity" values="0.2;1;1;0.2;0.2" keyTimes="0;0.25;0.75;0.9;1" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="600" y="360" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" fill="#94A3B8" letter-spacing="3.5">
      AI APPLICATION ARCHITECT  •  LOCAL RAG PIPELINES  •  BACKEND SYSTEMS
    </text>

    <rect width="1200" height="460" fill="none" stroke="#94A3B8" stroke-opacity="0.3" stroke-width="1.5" rx="16"/>
  </g>
</svg>
