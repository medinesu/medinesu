<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Derin Gece Gökyüzü ve Aurora Manzarası -->
    <linearGradient id="nightSky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="50%" stop-color="#040e1c"/>
      <stop offset="100%" stop-color="#020710"/>
    </linearGradient>

    <filter id="auroraBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <linearGradient id="auroraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#00b8d4" stop-opacity="0.28"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="moonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <radialGradient id="moonOuterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Pırlanta & Gümüş Yıldız İçin Özel Renkler -->
    <linearGradient id="silverMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="silverAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="diamondBloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feGaussianBlur stdDeviation="25" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="silverTextGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8">
        <animate attributeName="stop-color" values="#94A3B8;#FFFFFF;#38BDF8;#94A3B8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#38BDF8;#94A3B8;#FFFFFF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#CBD5E1">
        <animate attributeName="stop-color" values="#CBD5E1;#94A3B8;#FFFFFF;#CBD5E1" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- 1. Arka Plan -->
  <rect width="1200" height="460" fill="url(#nightSky)" rx="16"/>

  <!-- 2. Akışkan Kuzey Işıkları (Aurora) -->
  <g filter="url(#auroraBlur)">
    <path d="M-100,280 Q250,80 650,220 T1300,160 L1300,460 L-100,460 Z" fill="url(#auroraGradient)"/>
    <path d="M-100,340 Q350,150 750,280 T1300,240 L1300,460 L-100,460 Z" fill="#00e5ff" opacity="0.18"/>
  </g>

  <!-- 3. Parıldayan Yıldız Tozu Noktaları -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="150" cy="70" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="95" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="50" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="85" r="1.4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="60" r="1.7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="110" r="1.2"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="210" r="1" opacity="0.5"/>
    <circle cx="840" cy="190" r="1.2" opacity="0.6"/>
  </g>

  <!-- 4. Sol Üstte Dokulu Gerçekçi Dolunay -->
  <g transform="translate(190, 125)">
    <circle cx="0" cy="0" r="75" fill="url(#moonOuterGlow)">
      <animate attributeName="r" values="70;82;70" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="48" fill="url(#moonGrad)"/>
    <ellipse cx="-14" cy="-18" rx="10" ry="7" fill="#94a3b8" opacity="0.45" transform="rotate(-25 -14 -18)"/>
    <circle cx="15" cy="8" r="13" fill="#64748b" opacity="0.38"/>
    <circle cx="-12" cy="18" r="7" fill="#64748b" opacity="0.32"/>
    <ellipse cx="20" cy="-14" rx="6" ry="4" fill="#94a3b8" opacity="0.42"/>
  </g>

  <!-- 5. Sol Alt Çam Ormanı -->
  <g fill="#010308">
    <path d="M0,460 L0,390 Q150,380 320,405 L600,430 L600,460 Z"/>
    <polygon points="55,395 64,340 73,395"/>
    <polygon points="62,397 73,325 84,397"/>
    <polygon points="78,400 87,355 96,400"/>
    <polygon points="120,402 131,345 142,402"/>
    <polygon points="135,405 146,330 157,405"/>
    <polygon points="210,410 221,350 232,410"/>
  </g>
  <rect x="0" y="445" width="1200" height="15" fill="#010308"/>

  <!-- 6. MERKEZ: Kolyendeki Gümüş/Pırlanta Asimetrik Polaris (Mavi Daire Yok) -->
  <g transform="translate(600, 145)">
    <!-- Arkadaki ince beyaz/pırlanta ışıltı -->
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" opacity="0.1" filter="url(#diamondBloom)">
       <animate attributeName="opacity" values="0.05;0.2;0.05" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Asimetrik Bıçak Sırtı Form -->
    <g filter="url(#diamondBloom)">
      <!-- Üst Kısa -->
      <path d="M 0,-42 L 3,-10 L 0,0 L -3,-10 Z" fill="url(#silverMetal)"/>
      <!-- Sağ Kısa -->
      <path d="M 42,0 L 12,3 L 0,0 L 12,-3 Z" fill="url(#silverAccent)"/>
      <!-- Sol Kısa -->
      <path d="M -42,0 L -12,3 L 0,0 L -12,-3 Z" fill="url(#silverMetal)"/>
      <!-- ASİMETRİK İMZA: Hançer Alt Uzun Işın -->
      <path d="M 0,0 L 3,10 L 1.2,85 L -1.2,85 L -3,10 Z" fill="url(#silverMetal)">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
      </path>
      <!-- Ara İnce Parıltılar -->
      <path d="M 28,-28 L 8,-8 L 0,0 L -8,-8 Z" fill="url(#silverAccent)" opacity="0.75"/>
      <path d="M 28,28 L 8,8 L 0,0 L 8,-8 Z" fill="url(#silverMetal)" opacity="0.75"/>
      <path d="M -28,28 L -8,8 L 0,0 L -8,-8 Z" fill="url(#silverAccent)" opacity="0.75"/>
      <path d="M -28,-28 L -8,-8 L 0,0 L -8,-8 Z" fill="url(#silverMetal)" opacity="0.75"/>
    </g>
    <!-- Merkez Elmas Nokta -->
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" filter="url(#diamondBloom)">
      <animate attributeName="r" values="3.5;6;3.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    
    <!-- Havada asılı gibi hafif salınım animasyonu -->
    <animateTransform attributeName="transform" type="rotate" from="-6" to="6" dur="8s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- 7. TİPOGRAFİ -->
  <text x="600" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="9" filter="url(#diamondBloom)">
    POLARIS
  </text>

  <text x="600" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18.5" font-weight="500" fill="url(#silverTextGlow)" letter-spacing="1.5">
    The Unfailing Compass in an Orbit of Chaos
    <animate attributeName="opacity" values="0.15;1;1;0.15;0.15" keyTimes="0;0.25;0.75;0.9;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="360" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" fill="#94a3b8" letter-spacing="3.5">
    AI APPLICATION ARCHITECT  •  LOCAL RAG PIPELINES  •  BACKEND SYSTEMS
  </text>

  <rect width="1200" height="460" fill="none" stroke="#94A3B8" stroke-opacity="0.3" stroke-width="1.5" rx="16"/>
</svg>
