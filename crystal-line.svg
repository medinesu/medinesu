<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 6" width="450" height="6" fill="none">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <!-- x=0: Harfin bittiği pikselde anında başlayan net buzul mavisi -->
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9" />
      <stop offset="12%" stop-color="#7dd3fc" stop-opacity="0.95" />
      <!-- Parlak kristal ışık merkezi -->
      <stop offset="20%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="28%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="45%" stop-color="#7dd3fc" stop-opacity="0.5" />
      <!-- Sağa doğru süzülüp kaybolan uzun kuyruk -->
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Harfe sıfır mesafeden bağlanan kesintisiz kılcal hat -->
  <line x1="0" y1="3" x2="450" y2="3" stroke="url(#lineGrad)" stroke-width="1.5" />
  <!-- Kristal parlama odağı (harften hemen sonra göz alan elmas parıltı) -->
  <path d="M 45 3 Q 75 0.5 105 3 Q 75 5.5 45 3 Z" fill="#ffffff" opacity="0.95" />
</svg>
