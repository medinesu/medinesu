<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 4" width="500" height="4" fill="none">
  <defs>
    <linearGradient id="crystalGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <!-- x=0: Harfin bittiği yerde başlayan net buzul mavisi -->
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85" />
      <stop offset="10%" stop-color="#7dd3fc" stop-opacity="0.95" />
      <!-- Parlak kristal ışık merkezi -->
      <stop offset="25%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.5" />
      <!-- Sağa doğru süzülen 500px uzun kuyruk -->
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- 0'dan 500'e kadar kesintisiz, asla kaybolmayan kristal hat -->
  <path d="M 0 1.4 Q 110 0 500 2 Q 110 4 0 2.6 Z" fill="url(#crystalGlow)" />
</svg>
