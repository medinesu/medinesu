<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 4" width="500" height="4" fill="none">
  <defs>
    <linearGradient id="crystalGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <!-- Harften hemen sonra yumuşakça süzülen buzul mavisi nefes payı -->
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0" />
      <stop offset="6%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <!-- Kristal parıltı merkezi -->
      <stop offset="28%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.45" />
      <!-- Sağa doğru süzülen uzun kuyruk -->
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Harflerin dikey merkezinden akan 500px kesintisiz hat -->
  <path d="M0 2 Q250 0 500 2 Q250 4 0 2 Z" fill="url(#crystalGlow)" />
</svg>
