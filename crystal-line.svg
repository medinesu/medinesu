<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 4" width="450" height="4" fill="none">
  <defs>
    <linearGradient id="crystalWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <!-- Sol uç: Görünmez iğne ucu -->
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.3" />
      <!-- Orta: Parlak saf beyaz kristal merkezi -->
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.3" />
      <!-- Sağ uç: Görünmez iğne ucu -->
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- İki ucu da incecik (0px), ortası hafif dolgun (3.6px) kristal hat -->
  <path d="M 0 2 Q 225 0.2 450 2 Q 225 3.8 0 2 Z" fill="url(#crystalWhite)" />
</svg>
