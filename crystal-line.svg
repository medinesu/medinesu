<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 4" width="500" height="4" fill="none">
  <defs>
    <linearGradient id="crystalGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <!-- x=0'dan itibaren buzul mavisi -->
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="1" />
      <!-- BEYAZ IŞIK SOLA ALINDI: %12 seviyesinde parlar -->
      <stop offset="12%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Kesintisiz kılcal çizgi -->
  <line x1="0" y1="2" x2="500" y2="2" stroke="url(#crystalGlow)" stroke-width="1.5" />
  <!-- Elmas sola çekildi: 15px - 60px - 105px -->
  <path d="M 15 2 Q 60 0 105 2 Q 60 4 15 2 Z" fill="#ffffff" opacity="0.95" />
</svg>
